<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia de Compras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ac:#1a8fe3;--ui:#4f7cff;--ui2:#8b5cf6;--e:cubic-bezier(.2,.85,.3,1)}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-rows:58px 1fr;overflow:hidden;font:14px "Segoe UI",Arial,sans-serif;color:#1e2433;background:radial-gradient(800px 400px at 10% 0,#dfe6ff 0,#0000 70%),#eaeef6}
button,select{font:inherit;color:inherit;cursor:pointer;padding:7px 13px;background:#fff;border:1px solid #e3e7ef;border-radius:10px;transition:all .22s var(--e)}
button:hover{background:#f2f5ff;transform:translateY(-1px);box-shadow:0 4px 12px #4f7cff22}button:active{transform:scale(.95)}
.pri{background:linear-gradient(135deg,var(--ui),var(--ui2))!important;color:#fff!important;border:0!important;font-weight:600;box-shadow:0 4px 14px #4f7cff55}
.dan{color:#d33}.ok{color:#159a5b;font-weight:600}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes dockin{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
#top{display:flex;align-items:center;gap:8px;padding:0 16px;background:#fff;box-shadow:0 4px 24px #1e243312;position:relative;z-index:5}
.brand{border:0;background:none;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;padding:6px 10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ui),var(--ui2));display:grid;place-items:center;transition:transform .4s var(--e)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.1)}
#gts{flex:1;display:flex;gap:6px;overflow-x:auto;padding:6px 4px;min-width:0}
.gt{white-space:nowrap;border-color:transparent;background:#f1f3f9;border-radius:20px;padding:6px 14px;animation:pop .35s both}
.gt.on{background:linear-gradient(135deg,var(--ui),var(--ui2));color:#fff;font-weight:600;box-shadow:0 4px 14px #4f7cff55}
#app{display:grid;grid-template-columns:210px 1fr 250px;gap:12px;padding:12px;min-height:0;transition:grid-template-columns .45s var(--e)}
body.foc #app{grid-template-columns:0 1fr 250px}
#side,#insp{background:#fff;border-radius:18px;box-shadow:0 4px 24px #1e24330f;overflow:auto;padding:12px;min-width:0;transition:opacity .3s,padding .45s}
body.foc #side{padding:0;opacity:0;pointer-events:none}
.it{padding:9px 11px;border-radius:12px;cursor:pointer;margin-bottom:3px;display:flex;flex-direction:column;transition:all .22s var(--e)}
.it small{color:#8a92a8}.it:hover{background:#f4f6fb;transform:translateX(3px)}.it.sib{background:#f4f6fb}.it.on{background:#eaf0ff;box-shadow:inset 3px 0 0 var(--ui)}
.add{width:100%;margin-top:8px;border-style:dashed}
#main{position:relative;min-width:0;min-height:0}
#view{height:100%;overflow:auto;padding:20px 20px 96px}
#stage{display:flex;width:max-content;margin:0 auto;filter:drop-shadow(0 14px 30px #0003);transition:zoom .35s var(--e)}
#dock{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#1e2433ee;color:#fff;padding:6px;border-radius:18px;box-shadow:0 14px 40px #0006;backdrop-filter:blur(10px);animation:dockin .6s var(--e) both;z-index:6;white-space:nowrap}
#dock button{background:none;border:0;color:#fff;padding:7px 12px;border-radius:12px}
#dock button:hover{background:#ffffff26;box-shadow:none}#dock .on{background:var(--ui)}
.vs{width:1px;height:20px;background:#fff3;margin:0 4px}#zv{min-width:44px;text-align:center;font-size:12px;opacity:.8}.warn{color:#ff9d9d;font-weight:700;padding:0 8px}
#insp>*{animation:fade .3s var(--e) both}
#insp h3{margin:2px 0 4px;font-size:15px}#insp p{color:#68708a;margin:4px 0 10px;line-height:1.45}
.row{margin:14px 0}.row label{display:block;font-size:12px;color:#68708a;margin-bottom:5px;font-weight:600}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{padding:5px 12px}.seg .on{background:var(--ui);color:#fff;border-color:var(--ui)}
#insp .btn{width:100%;margin-bottom:6px;text-align:left}
input[type=color]{border:0;padding:0;width:34px;height:30px;background:none;cursor:pointer}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#1e2433;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 12px 40px #0006;display:none;z-index:99;max-width:440px;text-align:center}
#modal,#dlg{position:fixed;inset:0;background:#0b1020aa;backdrop-filter:blur(6px);z-index:90;display:none;align-items:center;justify-content:center;padding:30px}
#modal.show,#dlg.show{display:flex;animation:fade .25s both}#dlg{z-index:95}
#gn{font-weight:400;color:#68708a;font-size:13px}.brand{margin-right:auto}
.nm2{width:100%;border:1px solid transparent;border-radius:8px;padding:4px 6px;font:600 14px 'Segoe UI',Arial,sans-serif;background:transparent;margin-bottom:2px;transition:all .2s}.nm2:hover{border-color:#dbe2f3}.nm2:focus{outline:0;border-color:var(--ui);background:#fff}
.box.sm{width:min(440px,100%)}.box.sm h3{margin:0 0 6px;font-size:17px}.box.sm p{color:#68708a;margin:0 0 10px;line-height:1.45}
.box.sm input,.box.sm textarea{width:100%;margin:6px 0 14px;padding:10px 12px;border:1px solid #d9dfee;border-radius:10px;font:inherit}.box.sm textarea{height:160px;resize:vertical}
.rw{display:flex;gap:8px;justify-content:flex-end}.dgr{background:#e5484d!important;box-shadow:0 4px 14px #e5484d55!important}
.box{background:#fff;border-radius:22px;padding:24px;width:min(880px,100%);max-height:88vh;overflow:auto;animation:pop .35s var(--e) both;box-shadow:0 30px 80px #0007}
.box h2{margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{border-radius:16px;background:#f6f8fc;overflow:hidden;cursor:pointer;transition:all .25s var(--e);animation:pop .4s both}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #1e243322}.card.cur{outline:3px solid var(--ui)}
.card .th{height:90px;display:grid;place-items:center;color:#fff;font:700 15px Georgia,serif;padding:8px;text-align:center}
.card .in{padding:10px 12px}.card small{color:#8a92a8;display:block;margin-bottom:6px}
.card .ac{display:flex;gap:4px}.card .ac button{padding:3px 9px;font-size:12px}
.card.new{border:2px dashed #c9d3f5;background:none;display:grid;place-items:center;min-height:170px;color:var(--ui);font-weight:600}
/* ===== páginas ===== */
.page{display:none;width:210mm;height:297mm;background:#fff;color:#111;position:relative;flex-direction:column;overflow:hidden;flex:none;transition:box-shadow .3s}
.page.cur{display:flex}#stage.anim .page.cur{animation:rise .55s var(--e) both}
.page.act{box-shadow:0 0 0 3px var(--ui)}.cover.act{box-shadow:none}
.tab{position:absolute;top:0;width:34mm;height:2.2mm;background:var(--ac)}.L .tab{left:0}.R .tab{right:0}
.tab2{position:absolute;bottom:0;width:55%;height:2mm;background:var(--ac)}.L .tab2{left:0}.R .tab2{right:0}
.head{padding:7mm 8mm 2mm;min-height:18mm}.L .head{text-align:left}.R .head{text-align:right}
.head h1{display:inline-block;margin:0;font:700 27pt "Segoe UI",Arial,sans-serif;color:var(--ac);outline:none;min-width:30mm}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:minmax(0,1fr)}
.L .grid{padding:0 10mm 0 6mm}.R .grid{padding:0 6mm 0 10mm}
.foot{padding:1.5mm 8mm 5mm;font-size:12pt;font-weight:700;color:var(--ac)}.R .foot{text-align:right}
.blk{position:relative;border-bottom:1px solid #ececec;border-right:1px solid #ececec;display:flex;flex-direction:column;padding:2.5mm 3mm 1.5mm;min-height:0;min-width:0;overflow:hidden;cursor:pointer;transition:all .25s var(--e)}
.blk:not(.txt):hover{background:#f7faff;transform:translateY(-2px);box-shadow:0 8px 20px #0002;z-index:2}
.blk.sel,.blk.sel:hover{box-shadow:inset 0 0 0 3px var(--ui),0 8px 20px #0002}
#stage.anim .blk{animation:pop .45s var(--e) both;animation-delay:calc(var(--i)*28ms + .15s)}
.blk.pop{animation:pop .4s var(--e)}.blk.dz{box-shadow:inset 0 0 0 3px var(--ac);background:#e8f3ff}
.blk.dragging{opacity:.35;transform:scale(.94)}
.blk.dup:not(.sel){box-shadow:inset 0 0 0 2px #f5a623}.dupb{position:absolute;bottom:4px;right:4px;background:#f5a623;color:#fff;font:700 9px/1 system-ui,sans-serif;padding:3px 6px;border-radius:6px;z-index:3;pointer-events:none}
#top button:disabled{opacity:.35;cursor:default}
.hd{position:absolute;top:2px;right:4px;cursor:grab;color:#aab;font-size:15px;opacity:0;transition:opacity .2s;z-index:3}.blk:hover .hd{opacity:1}
.blk.txt{border:0;margin:1.5mm;border-radius:4mm;padding:6mm;justify-content:center;font-size:11pt;line-height:1.45}
.txt.vertical{writing-mode:vertical-rl;align-items:center}
.t{outline:none;white-space:pre-wrap}
.nm{font-weight:700;font-size:10pt;line-height:1.2;outline:none}
.ds{font-size:8pt;line-height:1.25;color:#444;outline:none;margin-top:.8mm}
[data-p]:empty:before{content:attr(data-p);opacity:.35;font-weight:400}
.searchbox{position:relative;display:block;width:100%;z-index:8}.searchbox .sku{width:100%;box-sizing:border-box}.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d9dfee;border-radius:10px;box-shadow:0 12px 30px #0002;max-height:280px;overflow:auto;display:none;z-index:20}.results.show{display:block}.result{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f1f5;line-height:1.25}.result:last-child{border-bottom:0}.result:hover{background:#eef3ff}.result b{display:block;font-size:12px}.result small{display:block;color:#68708a;font-size:10px;margin-top:2px}.nores{padding:10px;color:#8a92a8;font-size:11px}
.ph{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;text-align:center;padding-top:1.5mm}
.ph img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .35s var(--e)}.blk:hover .ph img{transform:scale(1.06)}
.sku{width:60%;border:0;border-bottom:1px dashed #ddd;font-size:9px;color:#777;padding:1px 0;outline:none;background:transparent;margin-bottom:1mm}
.cover{color:#fff;align-items:center;justify-content:center;text-align:center;padding:25mm}
.cover .frame{position:absolute;inset:10mm;border:.4mm solid #fff8;pointer-events:none}
.cover h1{font:700 58pt Georgia,serif;line-height:1.05;margin:0;width:100%;text-shadow:0 2px 14px #0004;position:relative}
.cover h1 div{outline:none}
.cover .rule{width:30mm;height:.6mm;background:#fff;margin:9mm auto;position:relative}
.cover .sub{font:300 15pt "Segoe UI",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;width:100%;line-height:1.6;outline:none;position:relative}

/* Organização das páginas e adaptação de tela */
.it.page-item{position:relative;padding-left:30px;cursor:grab;border:1px solid transparent;user-select:none}
.it.page-item:before{content:"⠿";position:absolute;left:10px;top:11px;color:#9aa3b8;font-size:17px;line-height:1}
.it.page-item.drag-page{opacity:.45;background:#eaf0ff;border:1px dashed var(--ui)}
.it.page-item.drop-page{box-shadow:inset 0 3px 0 var(--ui);background:#f2f5ff}
.it.page-item:active{cursor:grabbing}
#side .add{position:sticky;bottom:0;background:#fff;z-index:2}
@media(max-width:1100px){
 #app{grid-template-columns:175px minmax(0,1fr);gap:10px;padding:10px}
 #insp{position:fixed;right:12px;top:70px;bottom:12px;width:250px;z-index:8;box-shadow:0 12px 40px #1e243344}
 body.foc #app{grid-template-columns:0 minmax(0,1fr)}
}
@media(max-width:700px){

 body.foc #app{display:flex}
 body.foc #side{display:none}

}

@media print{
 body{display:block;height:auto;overflow:visible;background:none}
 #top,#side,#insp,#dock,#toast,#modal,#dlg,.hd,.sku,.dupb{display:none!important}
 #app,#main,#view{display:block;padding:0;overflow:visible;height:auto}#stage{display:block!important;zoom:1!important;filter:none}
 .page{display:flex!important;break-after:page;animation:none!important;box-shadow:none!important}.blk{cursor:auto;animation:none!important;box-shadow:none!important;transform:none!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@page{size:A4;margin:0}

/* Revisão visual e ergonomia */
:root{--ui:#3f5ee8;--ui2:#7656e8;--line:#e3e8f2;--ink:#1f293b}
body{color:var(--ink);background:radial-gradient(900px 450px at 5% 0,#e2e9ff 0,#0000 72%),#edf1f8}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable=true]:focus-visible{outline:2px solid #7e91f2;outline-offset:2px}

</style></head><body>
<div id="top">
 <button class="brand" id="lib" title="Abrir biblioteca de guias"><span class="logo">📖</span>Guia de Compras <small id="gn"></small> ▾</button>
 <input type="file" id="file" hidden accept=".xlsx,.xls,.csv">
 <button id="un" title="Desfazer (Ctrl+Z)">↶</button><button id="re" title="Refazer (Ctrl+Y)">↷</button>
 <button id="bx">📊 Planilha</button><button id="xl">⬇ Excel</button><button class="pri" id="pdf">⬇ PDF</button>
</div>
<div id="app">
 <div id="side"></div>
 <div id="main"><div id="view"><div id="stage"></div></div><div id="dock"></div></div>
 <div id="insp"></div>
</div>
<div id="toast"></div><div id="modal"></div><div id="dlg"></div>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;if(p)Object.assign(e,p);return e};
let DB=new Map(),NEW=null,CUR=0,SEL=null,Z=1,FOCUS=false,auto=true,ID='',LIB={list:[],cur:''};
const fresh=()=>({cover:{title:'',sub:'',c1:'#1a8fe3',c2:'#0b3d6b',img:''},pages:[newPage(),newPage()]});
let S=null;
const newPage=()=>({title:'seção',rows:4,blocks:[]});
const newProd=()=>({type:'prod',w:1,h:1,sku:'',name:'',desc:'',img:''});
const newText=()=>({type:'txt',w:1,h:2,text:'',bg:'#fbe4ee',fs:11,dir:'h'});
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('guia5',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
const kvGet=k=>idb.then(d=>new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})).catch(()=>{});
const kvSet=(k,v)=>idb.then(d=>{d.transaction('kv','readwrite').objectStore('kv').put(v,k)}).catch(()=>{});
const norm=()=>{if(!S.cover)S.cover=fresh().cover;if(!S.pages||!S.pages.length)S.pages=[newPage(),newPage()];
 S.pages.forEach(p=>p.blocks.forEach(b=>{if(b.type==='txt'){b.fs=b.fs||11;b.dir=b.dir||'h';b.bg=b.bg||'#fbe4ee'}}))};
const meta=()=>{const m=LIB.list.find(x=>x.id==ID);if(m){m.pages=S.pages.length+1;m.prods=S.pages.reduce((s,p)=>s+p.blocks.filter(b=>b.type!='txt'&&(b.sku||b.img||b.name)).length,0);m.c1=S.cover.c1;m.c2=S.cover.c2}};

const save=()=>{clearTimeout(flush.t);flush.t=setTimeout(flush,400)};

// ---- Excel ----
// Exporta no formato do "boneco": cada página vira uma coluna e os itens
// ficam em sequência nas linhas. O arquivo de referência serve somente como
// modelo de estrutura; nenhum conteúdo do boneco é importado para cá.
$('xl').onclick=()=>{
 if(!window.XLSX){toast('A biblioteca de Excel não carregou (precisa de internet).',7000);return}

 const pages=(S.pages||[]).map((p,i)=>({
   title:String(p.title||('Página '+String(i+1).padStart(2,'0'))),
   blocks:(p.blocks||[]).filter(b=>b && b.type!=='txt' && (b.sku||b.name||b.desc))
 }));
 const total=pages.reduce((n,p)=>n+p.blocks.length,0);
 if(!total){toast('Ainda não há produtos neste guia.');return}

 // Estrutura baseada no boneco enviado:
 // A = identificação do item | B em diante = uma coluna por página.
 const maxItems=Math.max(0,...pages.map(p=>p.blocks.length));
 const pageHeaders=pages.map((_,i)=>'Página '+String(i+1).padStart(2,'0'));
 const rows=[];
 rows.push(['','','','']);
 rows.push(['','Lista de Envio','1ª prova','Validade']);
 rows.push(['','','','']);
 rows.push(['','','','','','','','','']);
 rows.push(['Tema',...pageHeaders]);
 rows.push(['',...pages.map(p=>p.title)]);

 for(let i=0;i<maxItems;i++){
   const row=['Item '+String(i+1).padStart(2,'0')];
   pages.forEach(p=>{
     const b=p.blocks[i];
     if(!b){row.push('');return}
     // Apenas o conteúdo textual do item, sem URL/imagem e respeitando a ordem.
     row.push(String(b.name||b.desc||b.sku||'').trim());
   });
   rows.push(row);
 }

 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws['!merges']=[{s:{r:4,c:0},e:{r:5,c:0}}];
 const widths=[7.22,...pages.map(p=>{
   const vals=[p.title,...p.blocks.map(b=>String(b.name||b.desc||b.sku||''))];
   const longest=Math.max(18,...vals.map(v=>v.length));
   return Math.min(48,Math.max(24,Math.round(longest*0.9)));
 })];
 ws['!cols']=widths.map(w=>({wch:w}));
 ws['!rows']=[{hpt:18},{hpt:20},{hpt:18},{hpt:8},{hpt:22},{hpt:22}];

 // Estilos próximos ao modelo enviado.
 const border={style:'thin',color:{rgb:'000000'}};
 const fillHeader={patternType:'solid',fgColor:{rgb:'D9EAD3'}};
 const fillPage={patternType:'solid',fgColor:{rgb:'FFF2CC'}};
 const centered={horizontal:'center',vertical:'center',wrapText:true};
 const setStyle=(cell,style)=>{if(ws[cell])ws[cell].s=style};
 ['B2','C2','D2'].forEach(a=>setStyle(a,{font:{bold:true,sz:11},fill:fillHeader,alignment:centered,border:{top:border,bottom:border,left:border,right:border}}));
 setStyle('A5',{font:{bold:true,sz:11},alignment:centered,border:{top:border,bottom:border,left:border,right:border}});
 for(let c=1;c<=pages.length;c++){
   const col=XLSX.utils.encode_col(c);
   setStyle(col+'5',{font:{bold:true,sz:11},fill:fillHeader,alignment:centered,border:{top:border,bottom:border,left:border,right:border}});
   setStyle(col+'6',{font:{bold:true,sz:11},fill:fillPage,alignment:centered,border:{top:border,bottom:border,left:border,right:border}});
 }
 for(let r=7;r<7+maxItems;r++){
   setStyle('A'+r,{font:{sz:11},alignment:centered,border:{top:border,bottom:border,left:border,right:border}});
   for(let c=1;c<=pages.length;c++){
     const cell=XLSX.utils.encode_col(c)+r;
     setStyle(cell,{font:{sz:11},alignment:{vertical:'top',wrapText:true},border:{top:border,bottom:border,left:border,right:border}});
   }
 }

 XLSX.utils.book_append_sheet(wb,ws,'Planilha1');
 const filename=((S.cover.title||'guia')+' - itens.xlsx').replace(/[\\/:*?"<>|]/g,'');
 XLSX.writeFile(wb,filename,{cellStyles:true});
 toast('Excel gerado no formato do boneco com '+total+' itens.');
};

const isOldBlock=b=>{if(b.type==='txt'||!b.sku||!b.desc||(b.name&&String(b.name).trim()))return false;const d=DB.get(String(b.sku).trim());return !!d&&nrm(d.desc)===nrm(b.desc)};
async function migrate(){
 if(!DB.size){toast('Carregue a planilha antes (botão 📊 Planilha): só movo textos que batem com a descrição dela.',7000);return}
 flush();const plan=[];let total=0;
 for(const x of LIB.list){const g=x.id==ID?S:await kvGet('g:'+x.id);if(!g||!g.pages)continue;let n=0;g.pages.forEach(p=>(p.blocks||[]).forEach(b=>{if(isOldBlock(b))n++}));if(n){plan.push([x,g,n]);total+=n}}

 if(!ok)return;
 const move=g=>g.pages.forEach(p=>p.blocks.forEach(b=>{if(isOldBlock(b)){b.name=b.desc;b.desc=''}}));
 for(const [x,g] of plan){if(x.id==ID)act(()=>move(S));else{move(g);await kvSet('g:'+x.id,g)}}

function moveTo(s,p,i){const[fk,fi]=s.slice(1).split(':').map(Number),src=S.pages[fk];if(!src||(src===p&&fi===i))return;
 act(()=>{const it=src.blocks.splice(fi,1)[0];if(!it)return;p.blocks.splice(i,0,it);NEW=it;SEL=it;CUR=S.pages.indexOf(p)+1})}

// ---- busca de produtos: ignora acentos/maiúsculas, aceita palavras em qualquer ordem e pedaços de palavra, com ranking ----
const nrm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const IDX=new WeakMap();
function idxOf(u){let x=IDX.get(u);if(!x){const sk=nrm(u.sku),d=nrm(u.desc);x={sk,d,all:sk+' '+d,dc:d.replace(/ /g,'')};IDX.set(u,x)}return x}
function findProducts(q,max=40){
 const nq=nrm(q);if(!nq)return{list:[],total:0};
 const tk=nq.split(' '),joined=tk.join(''),out=[];
 for(const u of DB.values()){
  const x=idxOf(u);
  const ok=tk.every(t=>x.all.includes(t)||x.dc.includes(t))||x.dc.includes(joined)||x.sk.includes(joined);
  if(!ok)continue;
  let sc=0;
  if(x.sk===nq)sc+=1000;else if(x.sk.startsWith(nq))sc+=500;else if(x.sk.includes(nq))sc+=100;
  if(x.d.startsWith(nq))sc+=200;else if(x.d.includes(nq))sc+=80;
  for(const t of tk){if(x.d.startsWith(t)||x.d.includes(' '+t))sc+=15;}
  sc-=x.d.length/50;
  out.push([sc,u]);
 }
 out.sort((a,b)=>b[0]-a[0]);
 return{list:out.slice(0,max).map(o=>o[1]),total:out.length};
}

 pg.onclick=e=>{if(SEL&&!e.target.closest('.blk')){SEL=null;document.querySelectorAll('.blk.sel').forEach(x=>x.classList.remove('sel'));insp()}};
 const h=el('div','head'),t=el('h1','',{contentEditable:true,textContent:p.title});t.oninput=()=>{p.title=t.textContent;const nav=$('side').querySelector('.page-item[data-pageindex="'+k+'"] b');if(nav)nav.textContent='Pág. '+(k+2)+' · '+(p.title||'—');save()};h.append(t);
 const g=el('div','grid');p.blocks.forEach((b,j)=>g.append(block(p,b,j)));
 g.ondragover=e=>e.preventDefault();g.ondrop=e=>{if(e.target===g){e.preventDefault();const s=e.dataTransfer.getData('text/plain');if(s[0]=='b')moveTo(s,p,p.blocks.length)}};
 pg.append(el('div','tab'),h,g,el('div','foot',{textContent:n}),el('div','tab2'));return pg}

// ---- ações de página ----
function bulk(){ask({title:'Colar vários SKUs',text:'Um por linha, ou separados por vírgula/espaço. Eles preenchem esta página e continuam nas próximas.',input:1,area:1,ok:'Adicionar',ph:'SKU1\nSKU2\nSKU3'}).then(v=>{if(!v)return;
 const l=v.split(/[\s,;]+/).filter(Boolean);if(!l.length)return;
 act(()=>{let k=CUR-1,p=S.pages[k];const full=q=>q.blocks.reduce((s,x)=>s+x.w*x.h,0)>=3*q.rows;
  l.forEach(s=>{while(full(p)){if(!S.pages[++k])S.pages.push(newPage());p=S.pages[k]}const b=newProd();b.sku=s;p.blocks.push(b)})});
 const rp=[...new Set(l.map(x=>String(x).trim()))].filter(x=>(DUP.get(x)||[]).length>1).length;
 toast(l.length+' produtos adicionados.'+(rp?' ⚠ '+rp+' SKU(s) repetido(s) no guia — marcados em laranja.':''),rp?7000:4500)})}
function toggleFocus(){FOCUS=!FOCUS;document.body.classList.toggle('foc',FOCUS);animate();render();setTimeout(()=>{if(auto)fit()},470)}
function dock(){const d=$('dock');d.innerHTML='';const p=S.pages[CUR-1];
 if(FOCUS)d.append(mk('◀','Página anterior',()=>go(CUR-1)),mk('▶','Próxima página',()=>go(CUR+1)),el('span','vs'));
 if(p){d.append(mk('＋ Produto','Adicionar produto',()=>act(()=>{NEW=newProd();SEL=NEW;p.blocks.push(NEW)})),
  mk('＋ Texto','Adicionar quadro de texto',()=>act(()=>{NEW=newText();SEL=NEW;p.blocks.push(NEW)})));
  if(p.blocks.reduce((s,x)=>s+x.w*x.h,0)>3*p.rows)d.append(el('span','warn',{textContent:'⚠ não cabe',title:'Aumente as linhas no painel'}));
  d.append(el('span','vs'))}
 d.append(mk(FOCUS?'✕ Sair do foco':'🔍 Foco','Ampliar a página que você edita (tecla F)',toggleFocus,FOCUS?'on':''),el('span','vs'),
  mk('−','Diminuir',()=>setZ(Z-.1,true)),el('span','',{id:'zv',textContent:Math.round(Z*100)+'%'}),mk('+','Aumentar',()=>setZ(Z+.1,true)),mk('Ajustar','Encaixar na tela',fit))}

// ---- painel direito ----
function seg(lbl,opts,cur,fn){const w=el('div','row'),g=el('div','seg');w.append(el('label','',{textContent:lbl}),g);
 opts.forEach(o=>g.append(el('button',String(o.v)==String(cur)?'on':'',{textContent:o.t,onclick:()=>fn(o.v)})));return w}
function insp(){const r=$('insp');r.innerHTML='';const p=S.pages[CUR-1],b=SEL;
 if(CUR==0){const c=S.cover;r.append(el('h3','',{textContent:'Capa'}),el('p','',{textContent:'Cores do fundo ou foto.'}));
  const w=el('div','row');w.append(el('label','',{textContent:'Cores'}));
  ['c1','c2'].forEach(k=>w.append(el('input','',{type:'color',value:c[k],oninput:e=>{histTouch(c,k);c[k]=e.target.value;document.querySelector('.cover').style.background=cbg();save()}})));
  r.append(w,mk('🖼 Foto de fundo','',()=>pick(u=>act(()=>c.img=u)),'btn'),mk('Remover foto','',()=>act(()=>c.img=''),'btn'));return}
 if(!b){r.append(el('h3','',{textContent:'Página '+(CUR+1)}),el('p','',{textContent:'Clique em um produto para editar.'}));
  const order=el('div','row'),moves=el('div','seg'),up=mk('↑ Anterior','Mover a página uma posição para cima',()=>movePageBy(-1)),down=mk('↓ Próxima','Mover a página uma posição para baixo',()=>movePageBy(1));
  up.disabled=CUR<=1;down.disabled=CUR>=S.pages.length;order.append(el('label','',{textContent:'Ordem das páginas'}),moves);moves.append(up,down);r.append(order);
  r.append(seg('Linhas',[2,3,4,5,6,7,8].map(v=>({v,t:v})),p.rows,v=>act(()=>{p.rows=v;p.blocks.forEach(x=>x.h=Math.min(x.h,v))})),
  mk('📋 Colar vários SKUs','',bulk,'btn'),
  mk('🗑 Excluir página','',()=>ask({title:'Excluir a página '+(CUR+1)+'?',text:'Os itens dessa página serão perdidos.',ok:'Excluir',danger:1}).then(v=>{if(v)act(()=>{S.pages.splice(CUR-1,1);if(!S.pages.length)S.pages.push(newPage());CUR=Math.min(CUR,S.pages.length);SEL=null})}),'btn dan'));return}
 const t=b.type=='txt',i=p.blocks.indexOf(b);
 r.append(el('h3','',{textContent:t?'Quadro de texto':'Produto'+(b.sku?' · '+b.sku:'')}),
  seg('Largura',[1,2,3].map(v=>({v,t:v})),b.w,v=>act(()=>b.w=v)),
  seg('Altura',[1,2,3,4].filter(v=>v<=p.rows).map(v=>({v,t:v})),b.h,v=>act(()=>b.h=v)));
 if(t){r.append(seg('Tamanho do texto',[9,11,14,18,24].map(v=>({v,t:v})),b.fs,v=>act(()=>b.fs=v)),
  seg('Direção',[{v:'h',t:'Horizontal'},{v:'v',t:'Vertical'}],b.dir,v=>act(()=>b.dir=v)));
  const w=el('div','row');w.append(el('label','',{textContent:'Cor do quadro'}),el('input','',{type:'color',value:b.bg,oninput:e=>{histTouch(b,'bg');b.bg=e.target.value;const s=document.querySelector('.blk.sel');if(s)s.style.background=b.bg;save()}}));r.append(w)}
 else{const w=el('div','row');w.append(mk('📷 Escolher foto','',()=>pick(u=>act(()=>b.img=u)),'btn'));if(b.img)w.append(mk('Usar foto da planilha','',()=>act(()=>b.img=''),'btn'));r.append(w)}
 const mv=d=>act(()=>{const j=i+d;if(j>=0&&j<p.blocks.length){const it=p.blocks.splice(i,1)[0];p.blocks.splice(j,0,it);NEW=it}});
 const w=el('div','row'),g=el('div','seg');w.append(el('label','',{textContent:'Posição (ou arraste o item)'}),g);g.append(mk('◀ Antes','',()=>mv(-1)),mk('Depois ▶','',()=>mv(1)));
 r.append(w,mk('🗑 Excluir item','',()=>{act(()=>{p.blocks.splice(i,1);SEL=null});toast('Item excluído · Ctrl+Z para desfazer',3500)},'btn dan'))}

// ---- lateral, render, navegação ----
function movePageTo(from,dest){
 if(from<0||dest<0||from>=S.pages.length||dest>=S.pages.length||from===dest){toast('Essa página já está nessa posição.');return}
 histPush();const active=S.pages[CUR-1];const [moved]=S.pages.splice(from,1);S.pages.splice(dest,0,moved);CUR=S.pages.indexOf(active)+1;SEL=null;save();animate();render();toast('Ordem das páginas atualizada.');
}
function reorderPage(from,target){
 if(from<0||target<0||from>=S.pages.length||target>=S.pages.length||from===target){return}
 // O indicador fica antes do alvo; compensar quando a página vem de cima.
 const dest=from<target?target-1:target;
 if(dest===from){toast('Essa página já está nessa posição.');return}
 movePageTo(from,dest);
}
function movePageBy(dir){const from=CUR-1;if(from<0)return;movePageTo(from,from+dir)}
function side(){const s=$('side');s.innerHTML='';
 const head=el('div','sidehead');head.append(el('b','',{textContent:'PÁGINAS'}),el('span','page-count',{textContent:String(S.pages.length+1)}));s.append(head);
 const item=(i,t,sub)=>{const b=el('div','it'+(i==CUR?' on':(i>0&&vis(i-1)?' sib':'')));
  if(i>0){b.classList.add('page-item');b.draggable=!window.matchMedia('(max-width:700px)').matches;b.dataset.pageindex=String(i-1);
   b.ondragstart=e=>{e.dataTransfer.setData('text/page-index',String(i-1));e.dataTransfer.effectAllowed='move';b.classList.add('drag-page')};
   b.ondragend=()=>{b.classList.remove('drag-page');s.querySelectorAll('.drop-page').forEach(x=>x.classList.remove('drop-page'))};
   b.ondragover=e=>{if(e.dataTransfer.types.includes('text/page-index')){e.preventDefault();b.classList.add('drop-page')}};
   b.ondragleave=()=>b.classList.remove('drop-page');
   b.ondrop=e=>{e.preventDefault();e.stopPropagation();b.classList.remove('drop-page');const from=Number(e.dataTransfer.getData('text/page-index')),to=Number(b.dataset.pageindex);if(!Number.isInteger(from)||!Number.isInteger(to)||from===to)return;reorderPage(from,to)};
  }
  b.append(el('b','',{textContent:t}),el('small','',{textContent:sub}));b.onclick=()=>go(i);return b};
 s.append(item(0,'Capa',S.cover.title||'sem título'));
 S.pages.forEach((p,k)=>s.append(item(k+1,'Pág. '+(k+2)+' · '+(p.title||'—'),p.blocks.filter(b=>b.type!='txt').length+' produtos · '+(window.matchMedia('(max-width:700px)').matches?'mova no painel':'arraste para ordenar'))));
 s.append(mk('＋ Nova página','',addPage,'add'));if(window.matchMedia('(max-width:700px)').matches){const active=s.querySelector('.it.on');if(active)requestAnimationFrame(()=>active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}))}}
function go(i){CUR=Math.max(0,Math.min(S.pages.length,i));SEL=null;animate();render();$('view').scrollTop=0}
function addPage(){act(()=>{S.pages.push(newPage());CUR=S.pages.length;SEL=null});animate()}
function render(){calcDup();const st=$('stage');st.innerHTML='';st.append(coverPage());S.pages.forEach((p,k)=>st.append(pageEl(p,k)));tabs();side();dock();insp();histUI();if(auto)fit()}
addEventListener('keydown',e=>{const t=e.target;
 if(e.key=='Escape'){if($('dlg').className)$('dlg').onclick({target:$('dlg')});else if($('modal').className)closeLib();else if(FOCUS)toggleFocus();else if(SEL){SEL=null;render()}return}
 const modalOpen=$('dlg').className||$('modal').className;
 if((e.key=='Delete'||e.key=='Backspace')&&!modalOpen&&CUR>0&&SEL){
  const pg=S.pages[CUR-1],ix=pg?pg.blocks.indexOf(SEL):-1;
  // fora de campos de edição: exclui o item selecionado
  // dentro de um quadro de texto já vazio: exclui o quadro
  const emptyText=t.isContentEditable&&SEL.type=='txt'&&!(t.textContent||'').trim()&&t.closest('.blk.sel');
  if(ix>=0&&(emptyText||!(t.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(t.tagName)))){e.preventDefault();if(document.activeElement)document.activeElement.blur();act(()=>{pg.blocks.splice(ix,1);SEL=null});toast('Item excluído · Ctrl+Z para desfazer',3500);return}
 }
 const editing=t.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(t.tagName);
 if(!editing&&!modalOpen&&(e.ctrlKey||e.metaKey)){const kk=e.key.toLowerCase();
  if(kk=='z'&&!e.shiftKey){e.preventDefault();undo();return}
  if(kk=='y'||(kk=='z'&&e.shiftKey)){e.preventDefault();redo();return}}
 if(editing)return;
 const k=CUR-1,st=k-(k%2),single=FOCUS||window.matchMedia('(max-width:1100px)').matches;
 if(e.key=='f'||e.key=='F')toggleFocus();
 if(e.key=='ArrowRight'){if(single)go(CUR+1);else if(CUR==0)go(1);else if(st+2<S.pages.length)go(st+3)}
 if(e.key=='ArrowLeft'){if(single)go(CUR-1);else if(CUR<=1)go(0);else go(Math.max(st-2,0)+1)}});

function setZ(z,manual){Z=Math.max(.3,Math.min(2.2,z));if(manual)auto=false;$('stage').style.zoom=Z;const v=$('zv');if(v)v.textContent=Math.round(Z*100)+'%'}
function fit(){auto=true;const v=$('view'),mobile=window.matchMedia('(max-width:700px)').matches,single=window.matchMedia('(max-width:1100px)').matches,n=(CUR==0||FOCUS||single)?1:2;setZ(Math.min(FOCUS?2:1.3,(v.clientWidth-(mobile?16:40))/(794*n),(v.clientHeight-(mobile?50:116))/1123))}
addEventListener('resize',()=>{if(auto)fit()});
