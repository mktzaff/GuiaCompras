// Normaliza links de imagem vindos de Excel/CSV e links já salvos.
function normalizeImageUrl(value){
 let s=String(value??'').replace(/\uFEFF/g,'').trim();
 if(!s)return '';
 s=s.replace(/^=\s*(?:IMAGE|IMAGEM|HYPERLINK|HIPERLINK)\s*\(/i,'').replace(/\s*\)\s*$/,'').trim();
 const quoted=s.match(/^['"]([\s\S]*?)['"](?:\s*[;,].*)?$/);
 if(quoted)s=quoted[1].trim();
 s=s.replace(/&amp;/gi,'&').replace(/&#38;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'");
 // Algumas planilhas exportam texto adicional junto com o endereço.
 const m=s.match(/(?:https?:)?\/\/[^\s"'<>]+|(?:www\.)[^\s"'<>]+/i);
 if(m)s=m[0];
 s=s.replace(/[),;]+$/,'').trim();
 if(s.startsWith('//'))s='https:'+s;
 else if(/^www\./i.test(s))s='https://'+s;
 if(!/^https?:\/\//i.test(s)&&!/^data:image\//i.test(s)&&!/^blob:/i.test(s))return '';
 return s;
}

 const rp=[...new Set(l.map(x=>String(x).trim()))].filter(x=>(DUP.get(x)||[]).length>1).length;

 d.append(mk(FOCUS?'✕ Sair do foco':'🔍 Foco','Ampliar a página que você edita (tecla F)',toggleFocus,FOCUS?'on':''),el('span','vs'),
  mk('−','Diminuir',()=>setZ(Z-.1,true)),el('span','',{id:'zv',textContent:Math.round(Z*100)+'%'}),mk('+','Aumentar',()=>setZ(Z+.1,true)),mk('Ajustar','Encaixar na tela',fit))}

function seg(lbl,opts,cur,fn){const w=el('div','row'),g=el('div','seg');w.append(el('label','',{textContent:lbl}),g);
 opts.forEach(o=>g.append(el('button',String(o.v)==String(cur)?'on':'',{textContent:o.t,onclick:()=>fn(o.v)})));return w}
function insp(){const r=$('insp');r.innerHTML='';const p=S.pages[CUR-1],b=SEL;
 if(CUR==0){const c=S.cover;r.append(el('h3','',{textContent:'Capa'}),el('p','',{textContent:'Cores do fundo ou foto.'}));
  const w=el('div','row');w.append(el('label','',{textContent:'Cores'}));
  ['c1','c2'].forEach(k=>w.append(el('input','',{type:'color',value:c[k],oninput:e=>{histTouch(c,k);c[k]=e.target.value;document.querySelector('.cover').style.background=cbg();save()}})));
  r.append(w,mk('🖼 Foto de fundo','',()=>pick(u=>act(()=>c.img=u)),'btn'),mk('Remover foto','',()=>act(()=>c.img=''),'btn'));return}
 if(!b){r.append(el('h3','',{textContent:'Página '+(CUR+1)}),el('p','',{textContent:'Clique em um produto para editar.'}),
  seg('Linhas',[2,3,4,5,6,7,8].map(v=>({v,t:v})),p.rows,v=>act(()=>{p.rows=v;p.blocks.forEach(x=>x.h=Math.min(x.h,v))})),
  mk('📋 Colar vários SKUs','',bulk,'btn'),
  mk('🗑 Excluir página','',()=>ask({title:'Excluir a página '+(CUR+1)+'?',text:'Os itens dessa página serão perdidos.',ok:'Excluir',danger:1}).then(v=>{if(v)act(()=>{S.pages.splice(CUR-1,1);if(!S.pages.length)S.pages.push(newPage());CUR=Math.min(CUR,S.pages.length);SEL=null})}),'btn dan'));return}
 const t=b.type=='txt',i=p.blocks.indexOf(b);
 r.append(el('h3','',{textContent:t?'Quadro de texto':'Produto'+(b.sku?' · '+b.sku:'')}),
  seg('Largura',[1,2,3].map(v=>({v,t:v})),b.w,v=>act(()=>b.w=v)),
  seg('Altura',[1,2,3,4].filter(v=>v<=p.rows).map(v=>({v,t:v})),b.h,v=>act(()=>b.h=v)));
 if(t){r.append(seg('Tamanho do texto',[9,11,14,18,24].map(v=>({v,t:v})),b.fs,v=>act(()=>b.fs=v)),
  seg('Direção',[{v:'h',t:'Horizontal'},{v:'v',t:'Vertical'}],b.dir,v=>act(()=>b.dir=v)));
  const w=el('div','row');w.append(el('label','',{textContent:'Cor do quadro'}),el('input','',{type:'color',value:b.bg,oninput:e=>{histTouch(b,'bg');b.bg=e.target.value;const s=document.querySelector('.blk.sel');if(s)s.style.background=b.bg;save()}}));r.append(w)}
 else{const bw=el('div','row'),bl=el('label','',{textContent:'Comprador (campo discreto no item)'}),bi=el('input','',{value:b.buyer||'',placeholder:'Nome ou código do comprador'});bi.style.cssText='width:100%;padding:8px;border:1px solid #d9dfee;border-radius:8px;font:inherit';bi.onchange=()=>act(()=>{b.buyer=bi.value.trim()});bw.append(bl,bi);r.append(bw);if(b.sku&&BUYERS.has(String(b.sku).trim())&&!b.buyer)r.append(mk('↳ Preencher comprador da base','',()=>act(()=>b.buyer=BUYERS.get(String(b.sku).trim())),'btn'));const w=el('div','row');w.append(mk('📷 Escolher foto','',()=>pick(u=>act(()=>b.img=u)),'btn'));if(b.img)w.append(mk('Usar foto da planilha','',()=>act(()=>b.img=''),'btn'));r.append(w)}
 const mv=d=>act(()=>{const j=i+d;if(j>=0&&j<p.blocks.length){const it=p.blocks.splice(i,1)[0];p.blocks.splice(j,0,it);NEW=it}});
 const w=el('div','row'),g=el('div','seg');w.append(el('label','',{textContent:'Posição (ou arraste o item)'}),g);g.append(mk('◀ Antes','',()=>mv(-1)),mk('Depois ▶','',()=>mv(1)));
 r.append(w,mk('🗑 Excluir item','',()=>{act(()=>{p.blocks.splice(i,1);SEL=null});toast('Item excluído · Ctrl+Z para desfazer',3500)},'btn dan'))}

// ---- lateral, render, navegação ----
function reorderPage(from,to){
 if(!Number.isInteger(from)||!Number.isInteger(to)||from<0||to<0||from>=S.pages.length||to>=S.pages.length||from===to)return;
 histPush();const [pg]=S.pages.splice(from,1);S.pages.splice(to,0,pg);
 if(CUR===from+1)CUR=to+1;else if(from<CUR-1&&to>=CUR-1)CUR--;else if(from>CUR-1&&to<=CUR-1)CUR++;
 SEL=null;save();animate();render();toast('Ordem das páginas atualizada.');
}
function side(){const s=$('side');s.innerHTML='';
 const item=(i,t,sub)=>{const b=el('div','it'+(i==CUR?' on':(i>0&&vis(i-1)?' sib':'')));b.append(el('b','',{textContent:t}),el('small','',{textContent:sub}));b.onclick=()=>go(i);return b};
 s.append(item(0,'Capa',S.cover.title||'sem título'));
 S.pages.forEach((p,k)=>{
  const i=k+1,b=item(i,'Pág. '+(k+2)+' · '+(p.title||'—'),p.blocks.filter(x=>x.type!='txt').length+' produtos');
  b.classList.add('page-item');b.dataset.pageindex=String(k);b.draggable=!window.matchMedia('(max-width:700px)').matches;
  b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/page-index',String(k));e.dataTransfer.effectAllowed='move';b.classList.add('drag-page')});
  b.addEventListener('dragend',()=>{b.classList.remove('drag-page');s.querySelectorAll('.drop-page').forEach(x=>x.classList.remove('drop-page'))});
  b.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/page-index')){e.preventDefault();e.dataTransfer.dropEffect='move';b.classList.add('drop-page')}});
  b.addEventListener('dragleave',()=>b.classList.remove('drop-page'));
  b.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();b.classList.remove('drop-page');const from=Number(e.dataTransfer.getData('text/page-index'));if(Number.isInteger(from))reorderPage(from,k)});
  const controls=el('div','page-move');
  const up=mk('↑','Mover página para cima',e=>{},'');up.onclick=e=>{e.stopPropagation();reorderPage(k,k-1)};up.disabled=k===0;
  const down=mk('↓','Mover página para baixo',e=>{},'');down.onclick=e=>{e.stopPropagation();reorderPage(k,k+1)};down.disabled=k===S.pages.length-1;
  controls.append(up,down);b.append(controls);s.append(b);
 });
 s.append(mk('＋ Nova página','',addPage,'add'))}
function go(i){CUR=Math.max(0,Math.min(S.pages.length,i));SEL=null;animate();render();$('view').scrollTop=0}
function addPage(){act(()=>{S.pages.push(newPage());CUR=S.pages.length;SEL=null});animate()}
function render(){calcDup();const st=$('stage');st.innerHTML='';st.append(coverPage());S.pages.forEach((p,k)=>st.append(pageEl(p,k)));tabs();side();dock();insp();histUI();if(auto)fit()}
addEventListener('keydown',e=>{const t=e.target;
 if(e.key=='Escape'){if($('dlg').className)$('dlg').onclick({target:$('dlg')});else if($('modal').className)closeLib();else if(FOCUS)toggleFocus();else if(SEL){SEL=null;render()}return}
 const modalOpen=$('dlg').className||$('modal').className;
 if((e.key=='Delete'||e.key=='Backspace')&&!modalOpen&&CUR>0&&SEL){
  const pg=S.pages[CUR-1],ix=pg?pg.blocks.indexOf(SEL):-1;
  // fora de campos de edição: exclui o item selecionado
  // dentro de um quadro de texto já vazio: exclui o quadro
  const emptyText=t.isContentEditable&&SEL.type=='txt'&&!(t.textContent||'').trim()&&t.closest('.blk.sel');
  if(ix>=0&&(emptyText||!(t.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(t.tagName)))){e.preventDefault();if(document.activeElement)document.activeElement.blur();act(()=>{pg.blocks.splice(ix,1);SEL=null});toast('Item excluído · Ctrl+Z para desfazer',3500);return}
 }
 const editing=t.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(t.tagName);
 if(!editing&&!modalOpen&&(e.ctrlKey||e.metaKey)){const kk=e.key.toLowerCase();
  if(kk=='z'&&!e.shiftKey){e.preventDefault();undo();return}
  if(kk=='y'||(kk=='z'&&e.shiftKey)){e.preventDefault();redo();return}}
 if(editing)return;
 const k=CUR-1,st=k-(k%2);
 if(e.key=='f'||e.key=='F')toggleFocus();
 if(e.key=='ArrowRight'){if(FOCUS)go(CUR+1);else if(CUR==0)go(1);else if(st+2<S.pages.length)go(st+3)}
 if(e.key=='ArrowLeft'){if(FOCUS)go(CUR-1);else if(CUR<=1)go(0);else go(Math.max(st-2,0)+1)}});

function fit(){auto=true;const v=$('view'),n=(CUR==0||FOCUS)?1:2;setZ(Math.min(FOCUS?2:1.3,(v.clientWidth-40)/(794*n),(v.clientHeight-116)/1123))}

// Migra dados locais antigos somente se o banco compartilhado ainda não tiver uma biblioteca.
async function migrateLocalIfCloudEmpty(){
 await authReady;
 try {
  const cloudLib=await getDoc(doc(cloudDb,'appdata','lib'));
  if(cloudLib.exists()) return;
  const localDb=await new Promise((resolve,reject)=>{const req=indexedDB.open('guia5',1);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
  if(!localDb.objectStoreNames.contains('kv')) return;
  const entries=await new Promise((resolve,reject)=>{const tx=localDb.transaction('kv','readonly'),store=tx.objectStore('kv'),keysReq=store.getAllKeys(),valsReq=store.getAll();tx.oncomplete=()=>resolve(keysReq.result.map((k,i)=>[k,valsReq.result[i]]));tx.onerror=()=>reject(tx.error)});
  for(const [key,value] of entries){await setDoc(doc(cloudDb,'appdata',String(key)),{value,updatedAt:new Date().toISOString(),updatedBy:signedUser?.uid||'',migratedFromLocal:true})}
  if(entries.length) console.info('Dados locais migrados para o Firestore:',entries.length);
 } catch(e){console.warn('Migração local não executada:',e)}
}
migrateLocalIfCloudEmpty().then(()=>Promise.all([kvGet('lib'),kvGet('proj'),kvGet('db'),kvGet('buyers')])).then(async([lb,pj,db,buy])=>{
 if(db){DB=new Map(db);for(const [k,v] of DB){if(typeof v==='string')DB.set(k,{sku:k,desc:'',url:v})}let removed=0;for(const [k,v] of DB){if(String((v&&v.desc)||'').trim().startsWith('*')){DB.delete(k);removed++}}if(removed)await kvSet('db',[...DB])}
 if(buy)BUYERS=new Map(buy);
 if(lb&&lb.list&&lb.list.length){LIB=lb;ID=LIB.list.some(x=>x.id==LIB.cur)?LIB.cur:LIB.list[0].id;S=await kvGet('g:'+ID)||fresh()}
 else{ID='g1';S=pj&&pj.pages?pj:fresh();LIB={list:[{id:ID,name:(S.cover&&S.cover.title)||'Meu guia'}],cur:ID}}
 norm();S.pages.forEach(pg=>pg.blocks.forEach(b=>{if(b.type!=='txt'&&b.sku&&!b.buyer&&BUYERS.has(String(b.sku).trim()))b.buyer=BUYERS.get(String(b.sku).trim())}));flush();dbLabel();animate();render()});
