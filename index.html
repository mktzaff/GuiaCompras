<style>

.txt.vertical{writing-mode:vertical-rl;align-items:center}
.t{outline:none;white-space:pre-wrap}
.nm{font-weight:700;font-size:10pt;line-height:1.2;outline:none}
.ds{font-size:8pt;line-height:1.25;color:#444;outline:none;margin-top:.8mm}.buyerTag{display:flex;align-items:center;gap:3px;font-size:6.5pt;line-height:1.1;color:#8a92a8;min-height:0;margin-top:.5mm;white-space:nowrap;min-width:0;overflow:hidden}.buyerTag span{flex:1}.buyerEdit{flex:none;border:0;background:transparent;color:#8a92a8;padding:0 2px;font:10px/1 system-ui;cursor:pointer}.buyerEdit:hover{color:var(--ui)}@media print{.buyerEdit{display:none}.buyerTag{color:#777;font-size:6pt}}
[data-p]:empty:before{content:attr(data-p);opacity:.35;font-weight:400}
.searchbox{position:relative;display:block;width:100%;z-index:8}.searchbox .sku{width:100%;box-sizing:border-box}.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d9dfee;border-radius:10px;box-shadow:0 12px 30px #0002;max-height:280px;overflow:auto;display:none;z-index:20}.results.show{display:block}.result{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f1f5;line-height:1.25}.result:last-child{border-bottom:0}.result:hover{background:#eef3ff}.result b{display:block;font-size:12px}.result small{display:block;color:#68708a;font-size:10px;margin-top:2px}.nores{padding:10px;color:#8a92a8;font-size:11px}
.ph{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;text-align:center;padding-top:1.5mm}
.ph img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .35s var(--e)}.blk:hover .ph img{transform:scale(1.06)}
.sku{width:60%;border:0;border-bottom:1px dashed #ddd;font-size:9px;color:#777;padding:1px 0;outline:none;background:transparent;margin-bottom:1mm}
.cover{color:#fff;align-items:center;justify-content:center;text-align:center;padding:25mm}
.cover .frame{position:absolute;inset:10mm;border:.4mm solid #fff8;pointer-events:none}
.cover h1{font:700 58pt Georgia,serif;line-height:1.05;margin:0;width:100%;text-shadow:0 2px 14px #0004;position:relative}
.cover h1 div{outline:none}
.cover .rule{width:30mm;height:.6mm;background:#fff;margin:9mm auto;position:relative}
.cover .sub{font:300 15pt "Segoe UI",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;width:100%;line-height:1.6;outline:none;position:relative}
@media print{
 body{display:block;height:auto;overflow:visible;background:none}
 #top,#side,#insp,#dock,#toast,#modal,#dlg,.hd,.sku,.dupb{display:none!important}
 #app,#main,#view{display:block;padding:0;overflow:visible;height:auto}#stage{display:block!important;zoom:1!important;filter:none}
 .page{display:flex!important;break-after:page;animation:none!important;box-shadow:none!important}.blk{cursor:auto;animation:none!important;box-shadow:none!important;transform:none!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@page{size:A4;margin:0}
</style></head><body>
<div id="authGate" style="position:fixed;inset:0;z-index:99999;background:#f4f6fa;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:20px">
 <form id="authForm" style="width:min(420px,100%);background:#fff;border:1px solid #dce2ea;border-radius:18px;padding:28px;box-shadow:0 18px 55px #10203020;color:#182230">
  <div style="font-size:30px;margin-bottom:8px">📖</div><h2 style="margin:0 0 6px">Guia de Compras</h2><p style="margin:0 0 20px;color:#586779">Acesso restrito à equipe autorizada.</p>
  <label for="authEmail" style="display:block;font-size:13px;font-weight:600;margin:12px 0 5px">E-mail</label><input id="authEmail" type="email" autocomplete="username" required style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit">

  <button id="authSubmit" type="submit" style="margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:#1769d2;color:#fff;font:600 15px system-ui;cursor:pointer">Entrar</button>
  <p id="authError" role="alert" style="color:#b42318;font-size:13px;min-height:18px;margin-bottom:0"></p>
 </form>
</div>
<div id="top">
 <button class="brand" id="lib" title="Abrir biblioteca de guias"><span class="logo">📖</span>Guia de Compras <small id="gn"></small> ▾</button>
 <input type="file" id="file" hidden accept=".xlsx,.xls,.csv">
 <button id="un" title="Desfazer (Ctrl+Z)">↶</button><button id="re" title="Refazer (Ctrl+Y)">↷</button>
 <button id="dbm">🗄 Banco</button><button id="xl">⬇ Excel</button><button class="pri" id="pdf">⬇ PDF</button>
</div>
<div id="app">
 <div id="side"></div>
 <div id="main"><div id="view"><div id="stage"></div></div><div id="dock"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBhI-ufthYvwO-DNdErFXv88tYj1COY6mU",
  authDomain: "guias-de-compras.firebaseapp.com",
  projectId: "guias-de-compras",
  storageBucket: "guias-de-compras.firebasestorage.app",
  messagingSenderId: "132230119433",
  appId: "1:132230119433:web:4fe4881f05f414742fb8d8",
  measurementId: "G-274FMW0QN3"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const cloudDb = getFirestore(firebaseApp);
let authReadyResolve;
const authReady = new Promise(resolve => { authReadyResolve = resolve; });
const gate = document.getElementById('authGate');
const authForm = document.getElementById('authForm');
const authError = document.getElementById('authError');
let signedUser = null;
onAuthStateChanged(auth, user => {
  if (user) {
    signedUser = user;
    gate.style.display = 'none';
    authReadyResolve(user);
  } else {
    signedUser = null;
    gate.style.display = 'flex';
  }
});
authForm.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('authSubmit');
  btn.disabled = true; btn.textContent = 'Entrando…'; authError.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, document.getElementById('authEmail').value.trim(), document.getElementById('authPassword').value);
  } catch (err) {
    authError.textContent = 'Não foi possível entrar. Confere o e-mail e a senha e tenta novamente.';
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});
const $=id=>document.getElementById(id);
const el=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;if(p)Object.assign(e,p);return e};
let DB=new Map(),BUYERS=new Map(),NEW=null,CUR=0,SEL=null,Z=1,FOCUS=false,auto=true,ID='',LIB={list:[],cur:''};
const fresh=()=>({cover:{title:'',sub:'',c1:'#1a8fe3',c2:'#0b3d6b',img:''},pages:[newPage(),newPage()]});
let S=null;
const newPage=()=>({title:'seção',rows:4,blocks:[]});
const newProd=()=>({type:'prod',w:1,h:1,sku:'',name:'',desc:'',img:'',buyer:''});
const newText=()=>({type:'txt',w:1,h:2,text:'',bg:'#fbe4ee',fs:11,dir:'h'});
// O estado do Guia é salvo no Firestore para ficar compartilhado entre os computadores autorizados.
const kvGet=async k=>{await authReady;try{const snap=await getDoc(doc(cloudDb,'appdata',String(k)));return snap.exists()?snap.data().value:undefined}catch(e){console.error('Falha ao ler dados do Guia:',e);return undefined}};
const kvSet=async (k,v)=>{await authReady;try{await setDoc(doc(cloudDb,'appdata',String(k)),{value:v,updatedAt:new Date().toISOString(),updatedBy:signedUser?.uid||''})}catch(e){console.error('Falha ao salvar dados do Guia:',e);const err=document.getElementById('authError');if(err){err.textContent='Não foi possível salvar no banco. Verifique sua conexão e as regras do Firestore.';gate.style.display='flex'}}};
const norm=()=>{if(!S.cover)S.cover=fresh().cover;if(!S.pages||!S.pages.length)S.pages=[newPage(),newPage()];
 S.pages.forEach(p=>p.blocks.forEach(b=>{if(b.type==='txt'){b.fs=b.fs||11;b.dir=b.dir||'h';b.bg=b.bg||'#fbe4ee'}}))};
const meta=()=>{const m=LIB.list.find(x=>x.id==ID);if(m){m.pages=S.pages.length+1;m.prods=S.pages.reduce((s,p)=>s+p.blocks.filter(b=>b.type!='txt'&&(b.sku||b.img||b.name)).length,0);m.c1=S.cover.c1;m.c2=S.cover.c2}};
const flush=()=>{clearTimeout(flush.t);if(!ID||!LIB.list.some(x=>x.id==ID))return;meta();kvSet('g:'+ID,S);kvSet('lib',LIB)};
const save=()=>{clearTimeout(flush.t);flush.t=setTimeout(flush,400)};
const HIST={u:[],r:[],o:null,f:null,t:0};
const snap=()=>({cover:{...S.cover},pages:S.pages.map(p=>({...p,blocks:p.blocks.map(b=>({...b}))})),cur:CUR});
function histUI(){const u=$('un'),r=$('re');if(u)u.disabled=!HIST.u.length;if(r)r.disabled=!HIST.r.length}
function histPush(){if(!S)return;HIST.u.push(snap());if(HIST.u.length>60)HIST.u.shift();HIST.r=[];HIST.o=null;histUI()}
function histTouch(o,f){const n=Date.now();if(HIST.o!==o||HIST.f!==f||n-HIST.t>1500)histPush();HIST.o=o;HIST.f=f;HIST.t=n}
function histApply(x){S.cover=x.cover;S.pages=x.pages;CUR=Math.max(0,Math.min(S.pages.length,x.cur));SEL=null;HIST.o=null;save();render()}
function undo(){if(!HIST.u.length){toast('Nada para desfazer.',1800);return}HIST.r.push(snap());histApply(HIST.u.pop());toast('Desfeito · Ctrl+Y para refazer',2200)}
function redo(){if(!HIST.r.length){toast('Nada para refazer.',1800);return}HIST.u.push(snap());histApply(HIST.r.pop());toast('Refeito',1500)}
const act=fn=>{histPush();fn();save();render()};
const mk=(t,title,fn,c)=>el('button',c||'',{textContent:t,title,onclick:fn});
const toast=(m,ms=4500)=>{const t=$('toast');t.textContent=m;t.style.display='block';t.style.animation='none';t.offsetWidth;t.style.animation='pop .3s var(--e)';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)};
function ed(cls,o,k,ph){const e=el('div',cls,{contentEditable:true,textContent:o[k]||''});e.dataset.p=ph;e.oninput=()=>{histTouch(o,k);o[k]=e.textContent;save()};return e}
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=el('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/webp',.9))};i.src=r.result};r.readAsDataURL(f)}
function pick(cb){const i=el('input','',{type:'file',accept:'image/*'});i.onchange=()=>i.files[0]&&readImg(i.files[0],cb);i.click()}
function ask(o){return new Promise(res=>{const m=$('dlg');m.innerHTML='';m.className='show';
 const b=el('div','box sm'),done=v=>{m.className='';res(v)};b.append(el('h3','',{textContent:o.title}));

 }));
 const total=pages.reduce((n,p)=>n+p.blocks.length,0);
 if(!total){toast('Ainda não há produtos neste guia.');return}

 // Estrutura baseada no boneco enviado:
 // A = identificação do item | B em diante = uma coluna por página.
 const maxItems=Math.max(0,...pages.map(p=>p.blocks.length));
 const pageHeaders=pages.map((_,i)=>'Página '+String(i+1).padStart(2,'0'));
 const rows=[];

 rows.push(['','','','','','','','','']);
 rows.push(['Tema',...pageHeaders]);

   const row=['Item '+String(i+1).padStart(2,'0')];
   pages.forEach(p=>{
     const b=p.blocks[i];
     if(!b){row.push('');return}

     row.push(String(b.name||b.desc||b.sku||'').trim());

 setStyle('A5',{font:{bold:true,sz:11},alignment:centered,border:{top:border,bottom:border,left:border,right:border}});
 for(let c=1;c<=pages.length;c++){

 }

 XLSX.utils.book_append_sheet(wb,ws,'Planilha1');

// ---- busca de produtos: ignora acentos/maiúsculas, aceita palavras em qualquer ordem e pedaços de palavra, com ranking ----
const nrm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const IDX=new WeakMap();
function idxOf(u){let x=IDX.get(u);if(!x){const sk=nrm(u.sku),d=nrm(u.desc);x={sk,d,all:sk+' '+d,dc:d.replace(/ /g,'')};IDX.set(u,x)}return x}
function findProducts(q,max=40){
 const nq=nrm(q);if(!nq)return{list:[],total:0};
 const tk=nq.split(' '),joined=tk.join(''),out=[];
 for(const u of DB.values()){
  const x=idxOf(u);
  const ok=tk.every(t=>x.all.includes(t)||x.dc.includes(t))||x.dc.includes(joined)||x.sk.includes(joined);
  if(!ok)continue;
  let sc=0;
  if(x.sk===nq)sc+=1000;else if(x.sk.startsWith(nq))sc+=500;else if(x.sk.includes(nq))sc+=100;
  if(x.d.startsWith(nq))sc+=200;else if(x.d.includes(nq))sc+=80;
  for(const t of tk){if(x.d.startsWith(t)||x.d.includes(' '+t))sc+=15;}
  sc-=x.d.length/50;
  out.push([sc,u]);
 }
 out.sort((a,b)=>b[0]-a[0]);
 return{list:out.slice(0,max).map(o=>o[1]),total:out.length};
}

function side(){const s=$('side');s.innerHTML='';
 const item=(i,t,sub)=>{const b=el('div','it'+(i==CUR?' on':(i>0&&vis(i-1)?' sib':'')));b.append(el('b','',{textContent:t}),el('small','',{textContent:sub}));b.onclick=()=>go(i);return b};

addEventListener('keydown',e=>{const t=e.target;
 if(e.key=='Escape'){if($('dlg').className)$('dlg').onclick({target:$('dlg')});else if($('modal').className)closeLib();else if(FOCUS)toggleFocus();else if(SEL){SEL=null;render()}return}
 const modalOpen=$('dlg').className||$('modal').className;
 if((e.key=='Delete'||e.key=='Backspace')&&!modalOpen&&CUR>0&&SEL){
  const pg=S.pages[CUR-1],ix=pg?pg.blocks.indexOf(SEL):-1;
  // fora de campos de edição: exclui o item selecionado
  // dentro de um quadro de texto já vazio: exclui o quadro
  const emptyText=t.isContentEditable&&SEL.type=='txt'&&!(t.textContent||'').trim()&&t.closest('.blk.sel');
  if(ix>=0&&(emptyText||!(t.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(t.tagName)))){e.preventDefault();if(document.activeElement)document.activeElement.blur();act(()=>{pg.blocks.splice(ix,1);SEL=null});toast('Item excluído · Ctrl+Z para desfazer',3500);return}
 }
 const editing=t.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(t.tagName);
 if(!editing&&!modalOpen&&(e.ctrlKey||e.metaKey)){const kk=e.key.toLowerCase();
  if(kk=='z'&&!e.shiftKey){e.preventDefault();undo();return}
  if(kk=='y'||(kk=='z'&&e.shiftKey)){e.preventDefault();redo();return}}
 if(editing)return;
 const k=CUR-1,st=k-(k%2);
 if(e.key=='f'||e.key=='F')toggleFocus();
 if(e.key=='ArrowRight'){if(FOCUS)go(CUR+1);else if(CUR==0)go(1);else if(st+2<S.pages.length)go(st+3)}

// Migra dados locais antigos somente se o banco compartilhado ainda não tiver uma biblioteca.
async function migrateLocalIfCloudEmpty(){
 await authReady;
 try {
  const cloudLib=await getDoc(doc(cloudDb,'appdata','lib'));
  if(cloudLib.exists()) return;
  const localDb=await new Promise((resolve,reject)=>{const req=indexedDB.open('guia5',1);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
  if(!localDb.objectStoreNames.contains('kv')) return;
  const entries=await new Promise((resolve,reject)=>{const tx=localDb.transaction('kv','readonly'),store=tx.objectStore('kv'),keysReq=store.getAllKeys(),valsReq=store.getAll();tx.oncomplete=()=>resolve(keysReq.result.map((k,i)=>[k,valsReq.result[i]]));tx.onerror=()=>reject(tx.error)});
  for(const [key,value] of entries){await setDoc(doc(cloudDb,'appdata',String(key)),{value,updatedAt:new Date().toISOString(),updatedBy:signedUser?.uid||'',migratedFromLocal:true})}
  if(entries.length) console.info('Dados locais migrados para o Firestore:',entries.length);
 } catch(e){console.warn('Migração local não executada:',e)}
}
migrateLocalIfCloudEmpty().then(()=>Promise.all([kvGet('lib'),kvGet('proj'),kvGet('db'),kvGet('buyers')])).then(async([lb,pj,db,buy])=>{
 if(db){DB=new Map(db);for(const [k,v] of DB){if(typeof v==='string')DB.set(k,{sku:k,desc:'',url:v})}}
 if(buy)BUYERS=new Map(buy);
 if(lb&&lb.list&&lb.list.length){LIB=lb;ID=LIB.list.some(x=>x.id==LIB.cur)?LIB.cur:LIB.list[0].id;S=await kvGet('g:'+ID)||fresh()}
 else{ID='g1';S=pj&&pj.pages?pj:fresh();LIB={list:[{id:ID,name:(S.cover&&S.cover.title)||'Meu guia'}],cur:ID}}
 norm();S.pages.forEach(pg=>pg.blocks.forEach(b=>{if(b.type!=='txt'&&b.sku&&!b.buyer&&BUYERS.has(String(b.sku).trim()))b.buyer=BUYERS.get(String(b.sku).trim())}));flush();dbLabel();animate();render()});
